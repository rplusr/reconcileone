<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layered Slider</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #060606;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Padded page wrapper ─────────────────────────────────────────── */
    .ls-page {
      width: 100vw;
      height: 100vh;
      padding: 3.5rem 6rem;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 50%, rgba(124,58,237,0.05) 0%, transparent 55%),
        #060606;
    }

    /* ── Slider frame ────────────────────────────────────────────────── */
    .layered-slider {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 40px 100px rgba(0,0,0,0.85),
        0 10px 28px  rgba(0,0,0,0.5);
    }

    /* ── Background images ───────────────────────────────────────────── */
    .ls-bg-collection { position: absolute; inset: 0; }
    .ls-bg-item       { position: absolute; inset: 0; pointer-events: none; }
    .ls-bg-img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(16px) brightness(0.32) saturate(1.25);
      transform: scale(1.1);
    }

    /* ── Dark vignette ───────────────────────────────────────────────── */
    .ls-dark {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        linear-gradient(to top,   rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.1) 50%, transparent 100%),
        linear-gradient(to right, rgba(0,0,0,0.45) 0%, transparent 35%),
        linear-gradient(to left,  rgba(0,0,0,0.45) 0%, transparent 35%);
    }

    /* ── Card track ──────────────────────────────────────────────────── */
    /*
     * Spans full slider width so adjacent cards peek in from the sides.
     * The CSS mask fades out the far edges so the peek looks intentional.
     */
    .ls-mask-collection {
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-54%);
      height: min(360px, 50vh);
      overflow: hidden;
      z-index: 4;
      -webkit-mask-image: linear-gradient(to right,
        transparent 0%, black 9%, black 91%, transparent 100%);
      mask-image: linear-gradient(to right,
        transparent 0%, black 9%, black 91%, transparent 100%);
    }

    /* ── Individual card ─────────────────────────────────────────────── */
    .ls-mask-item {
      position: absolute;
      top: 0;
      height: 100%;
      width: min(240px, 26vw);
      /* room for depth layers without overflowing into adjacent cards */
      padding: 0 18px 18px 0;
      overflow: visible; /* layers clip at mask-collection level */
    }

    /* ── Depth card with stacked layers ──────────────────────────────── */
    .depth-card {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 14px;
      /* create stacking context so layers stay behind the image */
      isolation: isolate;
    }
    /* accent layer — peeks from behind, contained within mask-item padding */
    .depth-card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 14px;
      background: rgba(124,58,237,0.32);
      border: 1px solid rgba(124,58,237,0.45);
      transform: translate(9px, 10px) rotate(1.8deg);
      z-index: -1;
    }
    /* neutral layer — further back */
    .depth-card::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      transform: translate(17px, 18px) rotate(3.5deg);
      z-index: -2;
    }
    .ls-mask-img {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      box-shadow:
        0 4px  8px  rgba(0,0,0,0.35),
        0 12px 32px rgba(0,0,0,0.6),
        0 28px 64px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.07);
    }

    /* ── Title strip ─────────────────────────────────────────────────── */
    .ls-text-collection {
      position: absolute;
      bottom: 5.5rem; left: 0; right: 0;
      overflow: hidden; z-index: 5; pointer-events: none;
    }
    .ls-text-list {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      height: 5rem;
    }
    .ls-text-item   { position: absolute; pointer-events: auto; white-space: nowrap; }
    .ls-text-link {
      font-size: clamp(1.8rem, 3.8vw, 3.2rem);
      font-weight: 700;
      color: rgba(255,255,255,0.25);
      text-decoration: none;
      letter-spacing: -0.025em;
      line-height: 1;
      display: block;
    }
    .ls-text-item[data-active] .ls-text-link { color: #fff; }

    /* ── Controls overlay ────────────────────────────────────────────── */
    .ls-overlay {
      position: absolute; bottom: 1.75rem; left: 2rem; right: 2rem;
      display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }
    .ls-progress {
      display: flex; align-items: center; gap: 0.75rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em;
      color: rgba(255,255,255,0.4);
    }
    .ls-progress-bar   { width: 72px; height: 1px; background: rgba(255,255,255,0.14); overflow: hidden; }
    .ls-progress-fill  { height: 100%; background: rgba(255,255,255,0.65); transform-origin: left center; transform: scaleX(0); }
    .ls-nav            { display: flex; gap: 0.5rem; }
    .ls-button {
      width: 2.4rem; height: 2.4rem; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px);
      transition: background 0.2s, border-color 0.2s;
    }
    .ls-button:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.32); }
    .ls-nav-icon { width: 0.85rem; height: 0.85rem; }
  </style>
</head>
<body>
  <div class="ls-page">
    <section class="layered-slider" id="slider">

      <div class="ls-bg-collection"><div id="bg-list"></div></div>
      <div class="ls-dark"></div>

      <!-- Card track -->
      <div class="ls-mask-collection" id="mask-frame">
        <div id="mask-list"></div>
      </div>

      <!-- Titles -->
      <div class="ls-text-collection">
        <div id="text-list" class="ls-text-list"></div>
      </div>

      <!-- Counter + nav -->
      <div class="ls-overlay">
        <div class="ls-progress">
          <span id="ls-current">01</span>
          <div class="ls-progress-bar"><div id="ls-fill" class="ls-progress-fill"></div></div>
          <span id="ls-total">10</span>
        </div>
        <div class="ls-nav">
          <button id="ls-prev" class="ls-button" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round" class="ls-nav-icon">
              <path d="M15 6l-6 6 6 6"/>
            </svg>
          </button>
          <button id="ls-next" class="ls-button" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round" class="ls-nav-icon">
              <path d="M9 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
      </div>

    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Observer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/CustomEase.min.js"></script>
  <script>
    // ── Image data ────────────────────────────────────────────────────────────
    const IMAGES = [
      { src: "https://picsum.photos/seed/void1/800/600",        title: "Void I"                },
      { src: "https://picsum.photos/seed/abyss2/800/600",       title: "Abyss II"              },
      { src: "https://picsum.photos/seed/singularity3/800/600", title: "Singularity"           },
      { src: "https://picsum.photos/seed/event4/800/600",       title: "Event Horizon"         },
      { src: "https://picsum.photos/seed/dark5/800/600",        title: "Dark Matter"           },
      { src: "https://picsum.photos/seed/nebula6/800/600",      title: "Nebula VI"             },
      { src: "https://picsum.photos/seed/collapse7/800/600",    title: "Gravitational Collapse"},
      { src: "https://picsum.photos/seed/lensing8/800/600",     title: "Lensing"               },
      { src: "https://picsum.photos/seed/photon9/800/600",      title: "Photon Ring"           },
      { src: "https://picsum.photos/seed/accretion10/800/600",  title: "Accretion"             },
    ];

    // ── Build DOM ─────────────────────────────────────────────────────────────
    const bgList   = document.getElementById('bg-list');
    const maskList = document.getElementById('mask-list');
    const textList = document.getElementById('text-list');

    IMAGES.forEach(img => {
      const b = document.createElement('div');
      b.className = 'ls-bg-item';
      b.innerHTML = `<img src="${img.src}" alt="" class="ls-bg-img" loading="lazy">`;
      bgList.appendChild(b);

      const m = document.createElement('div');
      m.className = 'ls-mask-item';
      m.innerHTML = `<div class="depth-card"><img src="${img.src}" alt="${img.title}" class="ls-mask-img" draggable="false" loading="lazy"></div>`;
      maskList.appendChild(m);

      const t = document.createElement('div');
      t.className = 'ls-text-item';
      t.innerHTML = `<a href="#" class="ls-text-link">${img.title}</a>`;
      textList.appendChild(t);
    });

    // ── GSAP setup ────────────────────────────────────────────────────────────
    gsap.registerPlugin(Observer, CustomEase);
    CustomEase.create("osmo", "M0,0 C0.625,0.05 0,1 1,1");

    const root      = document.getElementById('slider');
    const titles    = [...root.querySelectorAll('.ls-text-item')];
    const bgs       = [...root.querySelectorAll('.ls-bg-item')];
    const masks     = [...root.querySelectorAll('.ls-mask-item')];
    const maskFrame = document.getElementById('mask-frame');
    const fill      = document.getElementById('ls-fill');
    const currentEl = document.getElementById('ls-current');
    const totalEl   = document.getElementById('ls-total');

    const count   = IMAGES.length;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp   = gsap.utils.clamp;
    const wrap    = d => d - count * Math.round(d / count);

    if (totalEl) totalEl.textContent = String(count).padStart(2, '0');

    // Measured each render cycle so resize is handled correctly
    let titleStep = 0, maskStep = 0, cardCenterX = 0;
    const measure = () => {
      const widest = Math.max(...titles.map(t => t.offsetWidth));
      titleStep   = Math.max(root.clientWidth * 0.5, widest + 48);
      const cardW  = masks[0] ? masks[0].offsetWidth : 300;
      const gap    = 28;
      maskStep    = cardW + gap;
      cardCenterX = maskFrame.clientWidth / 2 - cardW / 2;
    };
    measure();

    const state = { progress: 0 };
    let activeIndex = -1;

    const setActive = (prev, idx) => {
      [bgs, titles, masks].forEach(list => {
        if (prev >= 0 && list[prev]) list[prev].removeAttribute('data-active');
        if (list[idx])               list[idx].setAttribute('data-active', '');
      });
    };

    const render = progress => {
      const centered = ((Math.round(progress) % count) + count) % count;

      for (let i = 0; i < count; i++) {
        const offset   = wrap(i - progress);
        const distance = Math.abs(offset);

        // Background: crossfade between slides
        gsap.set(bgs[i], {
          opacity: clamp(0, 1, 1 - distance),
          zIndex:  Math.round(clamp(0, 1, 1 - distance) * 100),
        });

        // Titles: slide horizontally, dim non-active
        gsap.set(titles[i], {
          x:             offset * titleStep,
          opacity:       i === centered ? 1 : 0.28,
          pointerEvents: 'auto',
        });

        // Cards: slide + subtle scale + fade beyond ±1
        const cardOpacity = distance > 1.5 ? 0 : clamp(0, 1, 1.6 - distance);
        const cardScale   = clamp(0.88, 1, 1 - distance * 0.055);
        gsap.set(masks[i], {
          x:       cardCenterX + offset * maskStep,
          scale:   cardScale,
          opacity: cardOpacity,
          zIndex:  100 - Math.round(distance * 10),
        });
      }

      if (centered !== activeIndex) {
        setActive(activeIndex, centered);
        activeIndex = centered;
        if (currentEl) currentEl.textContent = String(centered + 1).padStart(2, '0');
      }
    };

    // ── Autoplay ──────────────────────────────────────────────────────────────
    let hovering = 0, autoTween = null;
    const startAutoplay = () => {
      if (!autoTween) return;
      autoTween.restart();
      if (hovering > 0) autoTween.pause();
    };

    if (!reduced && fill) {
      gsap.set(fill, { scaleX: 0, transformOrigin: 'left center' });
      autoTween = gsap.to(fill, {
        scaleX: 1, duration: 5, ease: 'none', paused: true,
        onComplete: () => goTo(1),
      });
    }

    // ── Navigation ────────────────────────────────────────────────────────────
    let slideTween = null, current = 0;
    function goTo(delta) {
      current += delta;
      if (slideTween) slideTween.kill();
      slideTween = gsap.to(state, {
        progress: current,
        duration: reduced ? 0 : 1,
        ease: 'osmo',
        onUpdate: () => render(state.progress),
      });
      startAutoplay();
    }
    const goToIndex = i => { const d = wrap(i - current); if (d !== 0) goTo(d); };

    document.getElementById('ls-prev').addEventListener('click', () => goTo(-1));
    document.getElementById('ls-next').addEventListener('click', () => goTo(1));

    titles.forEach(title => title.addEventListener('click', e => {
      const i = titles.indexOf(e.currentTarget);
      if (i === activeIndex) return;
      e.preventDefault();
      goToIndex(i);
    }));

    // ── Swipe ─────────────────────────────────────────────────────────────────
    let gestureUsed = false;
    Observer.create({
      target: root, type: 'touch,pointer', dragMinimum: 10, tolerance: 25, lockAxis: true,
      onDragStart() { gestureUsed = false; },
      onLeft()  { if (!gestureUsed) { gestureUsed = true; goTo(1);  } },
      onRight() { if (!gestureUsed) { gestureUsed = true; goTo(-1); } },
    });

    // ── Hover pauses autoplay ─────────────────────────────────────────────────
    [...new Set([...titles, ...root.querySelectorAll('a, button')])].forEach(el => {
      el.addEventListener('pointerenter', () => { hovering++; if (autoTween) autoTween.pause(); });
      el.addEventListener('pointerleave', () => {
        hovering = Math.max(0, hovering - 1);
        if (autoTween && hovering === 0) autoTween.resume();
      });
    });

    // ── Resize ────────────────────────────────────────────────────────────────
    const onResize = () => { measure(); render(state.progress); };
    window.addEventListener('resize', onResize);
    if (document.fonts) document.fonts.ready.then(onResize);

    // ── Init ──────────────────────────────────────────────────────────────────
    render(0);
    startAutoplay();
  </script>
</body>
</html>
